<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotel Krishnam - Hotel Management</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#eef3f8;
    color:#333;
}

header{
    background:#d90000;
    color:white;
    text-align:center;
    padding:20px 10px;
}

header h1{margin:0;font-size:28px}
header p{margin:5px 0 0}

.container{
    width:95%;
    max-width:1100px;
    margin:20px auto;
}

.section{
    background:white;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 2px 10px #bbb;
}

.section h2{
    color:#a51f2d;
    margin-top:0;
}

.dashboard{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.stat{
    background:#edf4ff;
    padding:18px;
    text-align:center;
    border-radius:10px;
}

.stat strong{
    display:block;
    font-size:24px;
    margin-bottom:5px;
}

.room-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
}

.room{
    padding:14px 5px;
    color:white;
    text-align:center;
    border-radius:8px;
    font-weight:bold;
}

.available{background:#10a651}
.booked{background:#e0a000}
.occupied{background:#d90000}
.cleaning{background:#7b4bb7}

label{
    display:block;
    font-weight:bold;
    margin-top:10px;
}

input,select{
    width:100%;
    padding:11px;
    margin-top:5px;
    border:1px solid #bbb;
    border-radius:6px;
    font-size:15px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

button{
    border:0;
    padding:10px 14px;
    border-radius:6px;
    color:white;
    cursor:pointer;
    font-size:14px;
    margin:4px;
}

.save-btn{background:#168a43}
.view-btn{background:#168de2}
.checkin-btn{background:#d98d00}
.checkout-btn{background:#dc3045}
.bill-btn{background:#673ab7}
.delete-btn{background:#d0008b}
.clean-btn{background:#7b4bb7}
.available-btn{background:#168a43}
.close-btn{background:#555}
.print-btn{background:#168a43}

.booking{
    border-left:6px solid #168de2;
    background:#f9fbfd;
    padding:15px;
    margin:15px 0;
    border-radius:8px;
}

.booking h3{
    color:#a51f2d;
    margin-top:0;
}

.status{
    display:inline-block;
    padding:5px 10px;
    border-radius:15px;
    color:white;
    background:#10a651;
}

.customer-box{
    background:#f3f7fb;
    padding:15px;
    border-radius:8px;
    margin-top:10px;
}

.bill{
    background:white;
    padding:25px;
    max-width:700px;
    margin:auto;
    border:1px solid #ddd;
}

.bill-header{
    text-align:center;
    border-bottom:2px solid #333;
    padding-bottom:15px;
}

.bill-header h1{
    margin:0;
    color:#d00000;
}

.bill-table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

.bill-table td{
    border:1px solid #bbb;
    padding:10px;
}

.bill-total td{
    font-size:18px;
    background:#f1f1f1;
}

.footer{
    text-align:center;
    padding:20px;
    color:#777;
}

@media(max-width:700px){

    .dashboard{
        grid-template-columns:repeat(2,1fr);
    }

    .room-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .form-grid{
        grid-template-columns:1fr;
    }
}

@media print{

    body *{visibility:hidden}

    #printArea,
    #printArea *{
        visibility:visible;
    }

    #printArea{
        position:absolute;
        left:0;
        top:0;
        width:100%;
        border:0;
    }

    .no-print{
        display:none!important;
    }
}
</style>
</head>

<body>

<header>
<h1>Hotel Krishnam</h1>
<p>Hotel Management System</p>
</header>

<div class="container">

<!-- DASHBOARD -->
<div class="section">
<h2>📊 Room Dashboard</h2>

<div class="dashboard">

<div class="stat">
<strong id="totalRooms">10</strong>
Total Rooms
</div>

<div class="stat">
<strong id="availableRooms">10</strong>
Available
</div>

<div class="stat">
<strong id="bookedRooms">0</strong>
Booked
</div>

<div class="stat">
<strong id="cleaningRooms">0</strong>
Cleaning
</div>

</div>
</div>


<!-- ROOM MANAGEMENT -->
<div class="section">

<h2>🛏 Room Management</h2>

<div id="roomGrid" class="room-grid"></div>

</div>


<!-- NEW BOOKING -->
<div class="section">

<h2>➕ New Booking</h2>

<div class="form-grid">

<div>
<label>Customer Name</label>
<input id="customerName" type="text">
</div>

<div>
<label>Mobile Number</label>
<input id="mobile" type="text">
</div>

<div>
<label>Customer Address</label>
<input id="address" type="text">
</div>

<div>
<label>Select Room</label>
<select id="roomNumber"></select>
</div>

<div>
<label>Check-In Date</label>
<input id="checkInDate" type="date">
</div>

<div>
<label>Check-In Time</label>
<input id="checkInTime" type="time">
</div>

<div>
<label>Check-Out Date</label>
<input id="checkOutDate" type="date">
</div>

<div>
<label>Check-Out Time</label>
<input id="checkOutTime" type="time">
</div>

<div>
<label>Advance Amount</label>
<input id="advance" type="number" value="0">
</div>

<div>
<label>Total Amount</label>
<input id="total" type="number" value="0">
</div>

</div>

<button class="save-btn" onclick="saveBooking()">
💾 Save Booking
</button>

</div>


<!-- CUSTOMER MANAGEMENT -->
<div class="section">

<h2>👤 Customer Management</h2>

<input
id="customerSearch"
type="text"
placeholder="Search customer name or mobile..."
oninput="searchCustomer()">

<div id="customerResults"></div>

</div>


<!-- BOOKING LIST -->
<div class="section">

<h2>📋 Booking List</h2>

<div id="bookingList"></div>

</div>


<!-- BILLING -->
<div class="section">

<h2>🧾 Billing / Invoice</h2>

<div id="billingInfo">
<p>Select <b>🧾 Bill</b> from a booking to view the bill.</p>
</div>

</div>

</div>

<div class="footer">
Hotel Krishnam © 2026
</div>


<script>

const defaultRooms=[

{number:"101",type:"AC",status:"Available"},
{number:"102",type:"AC",status:"Available"},
{number:"103",type:"AC",status:"Available"},
{number:"104",type:"AC",status:"Available"},
{number:"105",type:"AC",status:"Available"},

{number:"106",type:"Non-AC",status:"Available"},
{number:"107",type:"Non-AC",status:"Available"},
{number:"108",type:"Non-AC",status:"Available"},
{number:"109",type:"Non-AC",status:"Available"},
{number:"110",type:"Non-AC",status:"Available"}

];


let rooms=
JSON.parse(localStorage.getItem("hotelRooms"))||
JSON.parse(JSON.stringify(defaultRooms));

let bookings=
JSON.parse(localStorage.getItem("hotelBookings"))||[];


/* पुराने data में Cleaning status को भी support करें */

rooms.forEach(room=>{

if(!["Available","Booked","Occupied","Cleaning"]
.includes(room.status)){

room.status="Available";

}

});


function saveData(){

localStorage.setItem(
"hotelRooms",
JSON.stringify(rooms)
);

localStorage.setItem(
"hotelBookings",
JSON.stringify(bookings)
);

}


function escapeHTML(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* ROOMS */

function renderRooms(){

const grid=document.getElementById("roomGrid");

const select=document.getElementById("roomNumber");

grid.innerHTML="";
select.innerHTML="";


rooms.forEach(room=>{

const div=document.createElement("div");

div.className=
"room "+
room.status.toLowerCase();

div.innerHTML=
`
Room ${room.number}<br>
${room.type}<br>
${room.status}
`;

grid.appendChild(div);


/* केवल Available rooms booking में दिखें */

if(room.status==="Available"){

const option=document.createElement("option");

option.value=room.number;

option.textContent=
`Room ${room.number} - ${room.type}`;

select.appendChild(option);

}

});

updateDashboard();

}


/* DASHBOARD */

function updateDashboard(){

const available=
rooms.filter(r=>r.status==="Available").length;

const booked=
rooms.filter(r=>r.status==="Booked").length;

const cleaning=
rooms.filter(r=>r.status==="Cleaning").length;

document.getElementById("totalRooms")
.textContent=rooms.length;

document.getElementById("availableRooms")
.textContent=available;

document.getElementById("bookedRooms")
.textContent=booked;

document.getElementById("cleaningRooms")
.textContent=cleaning;

}


/* SAVE BOOKING */

function saveBooking(){

const customerName=
document.getElementById("customerName").value.trim();

const mobile=
document.getElementById("mobile").value.trim();

const address=
document.getElementById("address").value.trim();

const roomNumber=
document.getElementById("roomNumber").value;

const checkInDate=
document.getElementById("checkInDate").value;

const checkInTime=
document.getElementById("checkInTime").value;

const checkOutDate=
document.getElementById("checkOutDate").value;

const checkOutTime=
document.getElementById("checkOutTime").value;

const advance=
Number(document.getElementById("advance").value)||0;

const total=
Number(document.getElementById("total").value)||0;


if(!customerName){

alert("Please enter Customer Name");
return;

}

if(!roomNumber){

alert("Please select a room");
return;

}


bookings.push({

customerName,
mobile,
address,
roomNumber,
checkInDate,
checkInTime,
checkOutDate,
checkOutTime,
advance,
total,
status:"Booked"

});


const room=
rooms.find(r=>r.number===roomNumber);

if(room){

room.status="Booked";

}


saveData();

renderRooms();

renderBookings();


document.getElementById("customerName").value="";
document.getElementById("mobile").value="";
document.getElementById("address").value="";
document.getElementById("advance").value="0";
document.getElementById("total").value="0";


alert("Booking Saved Successfully!");

}


/* BOOKING LIST */

function renderBookings(){

const list=document.getElementById("bookingList");

list.innerHTML="";


if(bookings.length===0){

list.innerHTML="<p>No booking found.</p>";

return;

}


bookings.forEach((booking,index)=>{

let buttons="";


buttons+=`
<button
class="view-btn"
onclick="viewBooking(${index})">
👁 View
</button>
`;


if(booking.status==="Booked"){

buttons+=`
<button
class="checkin-btn"
onclick="checkInBooking(${index})">
🟢 Check-In
</button>
`;

}


if(booking.status==="Checked-In"){

buttons+=`
<button
class="checkout-btn"
onclick="checkOutBooking(${index})">
🔴 Check-Out
</button>
`;

}


/* BILL BUTTON */

buttons+=`
<button
class="bill-btn"
onclick="createBill(${index})">
🧾 Bill
</button>
`;


/* DELETE */

buttons+=`
<button
class="delete-btn"
onclick="deleteBooking(${index})">
🗑 Delete
</button>
`;


list.innerHTML+=`

<div class="booking">

<h3>
🛏 Room ${escapeHTML(booking.roomNumber)}
</h3>

<p>
<b>Customer:</b>
${escapeHTML(booking.customerName)}
</p>

<p>
<b>Mobile:</b>
${escapeHTML(booking.mobile)}
</p>

<p>
<b>Address:</b>
${escapeHTML(booking.address||"-")}
</p>

<p>
<b>Check-In:</b>
${escapeHTML(booking.checkInDate)}
${escapeHTML(booking.checkInTime)}
</p>

<p>
<b>Check-Out:</b>
${escapeHTML(booking.checkOutDate)}
${escapeHTML(booking.checkOutTime)}
</p>

<p>
<b>Advance:</b>
₹${Number(booking.advance)||0}
</p>

<p>
<b>Total:</b>
₹${Number(booking.total)||0}
</p>

<p>
<b>Status:</b>
<span class="status">
${escapeHTML(booking.status)}
</span>
</p>

<div>
${buttons}
</div>

</div>

`;

});

}


/* VIEW */

function viewBooking(index){

const b=bookings[index];

alert(

"Customer: "+b.customerName+
"\nMobile: "+b.mobile+
"\nAddress: "+(b.address||"-")+
"\nRoom: "+b.roomNumber+
"\nCheck-In: "+b.checkInDate+" "+b.checkInTime+
"\nCheck-Out: "+b.checkOutDate+" "+b.checkOutTime+
"\nAdvance: ₹"+(b.advance||0)+
"\nTotal: ₹"+(b.total||0)+
"\nStatus: "+b.status

);

}


/* CHECK IN */

function checkInBooking(index){

const booking=bookings[index];

booking.status="Checked-In";


const room=
rooms.find(r=>r.number===booking.roomNumber);

if(room){

room.status="Occupied";

}


saveData();

renderRooms();

renderBookings();

}


/* CHECK OUT → CLEANING */

function checkOutBooking(index){

const booking=bookings[index];

booking.status="Checked-Out";


const room=
rooms.find(r=>r.number===booking.roomNumber);

if(room){

room.status="Cleaning";

}


saveData();

renderRooms();

renderBookings();


alert(
"Check-Out complete.\nRoom "+booking.roomNumber+
" is now in Cleaning."
);

}


/* MARK ROOM AVAILABLE */

function markRoomAvailable(roomNumber){

const room=
rooms.find(r=>r.number===roomNumber);

if(!room){

return;

}


if(room.status!=="Cleaning"){

return;

}


room.status="Available";


saveData();

renderRooms();

renderBookings();


alert(
"Room "+roomNumber+
" is now Available."
);

}


/* DELETE */

function deleteBooking(index){

if(!confirm("Delete this booking?")){

return;

}


const booking=bookings[index];

const room=
rooms.find(r=>r.number===booking.roomNumber);


/*
अगर booking delete हो रही है और room Cleaning में है
तो room को Available कर देंगे।
*/

if(room){

room.status="Available";

}


bookings.splice(index,1);

saveData();

renderRooms();

renderBookings();

}


/* CUSTOMER SEARCH */

function searchCustomer(){

const search=
document.getElementById("customerSearch")
.value
.toLowerCase()
.trim();

const result=
document.getElementById("customerResults");

result.innerHTML="";


if(!search){

return;

}


const found=
bookings.filter(b=>

String(b.customerName)
.toLowerCase()
.includes(search)

||

String(b.mobile)
.toLowerCase()
.includes(search)

);


if(found.length===0){

result.innerHTML="<p>No customer found.</p>";

return;

}


found.forEach(b=>{

result.innerHTML+=`

<div class="customer-box">

<b>Name:</b>
${escapeHTML(b.customerName)}
<br>

<b>Mobile:</b>
${escapeHTML(b.mobile)}
<br>

<b>Address:</b>
${escapeHTML(b.address||"-")}
<br>

<b>Room:</b>
${escapeHTML(b.roomNumber)}
<br>

<b>Check-In:</b>
${escapeHTML(b.checkInDate)}
${escapeHTML(b.checkInTime)}
<br>

<b>Check-Out:</b>
${escapeHTML(b.checkOutDate)}
${escapeHTML(b.checkOutTime)}
<br>

<b>Status:</b>
${escapeHTML(b.status)}

</div>

`;

});

}


/* BILL */

function createBill(index){

const booking=bookings[index];

if(!booking)return;


const total=
Number(booking.total)||0;

const advance=
Number(booking.advance)||0;

const balance=
Math.max(0,total-advance);


const billHTML=`

<div id="printArea" class="bill">

<div class="bill-header">

<h1>Hotel Krishnam</h1>

<p><b>Hotel Management System</b></p>

<p><b>INVOICE / BILL</b></p>

</div>


<table class="bill-table">

<tr>
<td><b>Customer Name</b></td>
<td>${escapeHTML(booking.customerName)}</td>
</tr>

<tr>
<td><b>Mobile</b></td>
<td>${escapeHTML(booking.mobile)}</td>
</tr>

<tr>
<td><b>Address</b></td>
<td>${escapeHTML(booking.address||"-")}</td>
</tr>

<tr>
<td><b>Room Number</b></td>
<td>${escapeHTML(booking.roomNumber)}</td>
</tr>

<tr>
<td><b>Check-In</b></td>
<td>
${escapeHTML(booking.checkInDate)}
${escapeHTML(booking.checkInTime)}
</td>
</tr>

<tr>
<td><b>Check-Out</b></td>
<td>
${escapeHTML(booking.checkOutDate)}
${escapeHTML(booking.checkOutTime)}
</td>
</tr>

<tr>
<td><b>Total Amount</b></td>
<td>₹${total}</td>
</tr>

<tr>
<td><b>Advance Paid</b></td>
<td>₹${advance}</td>
</tr>

<tr class="bill-total">
<td><b>Balance Due</b></td>
<td><b>₹${balance}</b></td>
</tr>

</table>


<p style="text-align:center;margin-top:25px">
Thank you for staying at Hotel Krishnam.
</p>


<div
class="no-print"
style="text-align:center;margin-top:20px">

<button
class="print-btn"
onclick="window.print()">
🖨️ Print Bill
</button>

<button
class="close-btn"
onclick="closeBill()">
✖ Close
</button>

</div>

</div>

`;


document.getElementById("billingInfo")
.innerHTML=billHTML;


document.getElementById("billingInfo")
.scrollIntoView({
behavior:"smooth"
});

}


function closeBill(){

document.getElementById("billingInfo")
.innerHTML=
"<p>Select 🧾 Bill from a booking to view the bill.</p>";

}


/* INITIAL LOAD */

renderRooms();

renderBookings();

</script>

</body>
</html>
