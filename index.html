<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotel Krishnam</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f4f4;
}

.header{
    background:#c62828;
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
    padding:15px;
}

.card{
    background:white;
    padding:20px;
    margin-bottom:20px;
    border-radius:10px;
    box-shadow:0 2px 8px #ccc;
}

h2{
    color:#c62828;
}

.room{
    border:1px solid #ddd;
    padding:15px;
    margin-bottom:10px;
    border-radius:8px;
}

button{
    padding:10px 15px;
    margin:5px;
    border:none;
    border-radius:6px;
    background:#1976d2;
    color:white;
    cursor:pointer;
}

.delete{
    background:#d32f2f;
}

.booking-form{
    display:grid;
    gap:12px;
}

.booking-form input,
.booking-form select,
.booking-form textarea{
    width:100%;
    box-sizing:border-box;
    padding:12px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:16px;
}

.booking-form textarea{
    min-height:90px;
    resize:vertical;
}

.booking-form label{
    font-weight:bold;
    color:#555;
}

.footer{
    text-align:center;
    padding:20px;
    color:#777;
}
</style>
</head>

<body>

<div class="header">
    <h1>🏨 Hotel Krishnam</h1>
    <p>Hotel Management System</p>
</div>

<div class="container">

<!-- ROOMS -->
<div class="card">
    <h2>🏨 Rooms</h2>
    <div id="roomsList"></div>
</div>

<!-- NEW BOOKING -->
<div class="card">
    <h2>📝 New Booking</h2>

    <div class="booking-form">

        <input type="text" id="customerName"
        placeholder="Customer Name">

        <input type="tel" id="customerMobile"
        placeholder="Mobile Number">

        <textarea id="customerAddress"
        placeholder="Customer Address"></textarea>

        <select id="bookingRoom">
            <option value="">Select Room</option>
        </select>

        <label>Check-In Date</label>
        <input type="date" id="checkInDate">

        <label>Check-In Time</label>
        <input type="time" id="checkInTime">

        <label>Check-Out Date</label>
        <input type="date" id="checkOutDate">

        <label>Check-Out Time</label>
        <input type="time" id="checkOutTime">

        <input type="number" id="advance"
        placeholder="Advance Amount">

        <input type="number" id="totalAmount"
        placeholder="Total Amount">

        <button onclick="saveBooking()">
            💾 Save Booking
        </button>

    </div>
</div>

<!-- BOOKING LIST -->
<div class="card">
    <h2>📋 Booking List</h2>
    <div id="bookingList">
        <p>No bookings yet.</p>
    </div>
</div>

</div>

<div class="footer">
    Hotel Krishnam © 2026
</div>

<script>

let rooms = [
    let rooms = JSON.parse(localStorage.getItem("hotelRooms")) || [
    {number:"101", type:"AC", status:"Available"},
    {number:"102", type:"AC", status:"Available"},
    {number:"103", type:"AC", status:"Available"},
    {number:"104", type:"AC", status:"Available"},
    {number:"105", type:"AC", status:"Available"},
    {number:"106", type:"Non-AC", status:"Available"},
    {number:"107", type:"Non-AC", status:"Available"},
    {number:"108", type:"Non-AC", status:"Available"},
    {number:"109", type:"Non-AC", status:"Available"},
    {number:"110", type:"Non-AC", status:"Available"}
];
    
    
let bookings = JSON.parse(localStorage.getItem("hotelBookings")) || [];


function showRooms(){

    const list = document.getElementById("roomsList");

    list.innerHTML = "";

    rooms.forEach(room => {

        list.innerHTML += `
        <div class="room">

            <h3>Room ${room.number}</h3>

            <p>
            <b>Type:</b> ${room.type}
            </p>

            <p>
            <b>Status:</b> ${room.status}
            </p>

        </div>
        `;

    });

}


function loadBookingRooms(){

    const select =
    document.getElementById("bookingRoom");

    select.innerHTML =
    '<option value="">Select Room</option>';

    rooms.forEach(room => {

        if(room.status === "Available"){

            select.innerHTML += `
            <option value="${room.number}">
            Room ${room.number} - ${room.type}
            </option>
            `;

        }

    });

}


function saveBooking(){

    const name =
    document.getElementById("customerName").value.trim();

    const mobile =
    document.getElementById("customerMobile").value.trim();

    const address =
    document.getElementById("customerAddress").value.trim();

    const roomNumber =
    document.getElementById("bookingRoom").value;

    const checkInDate =
    document.getElementById("checkInDate").value;

    const checkInTime =
    document.getElementById("checkInTime").value;

    const checkOutDate =
    document.getElementById("checkOutDate").value;

    const checkOutTime =
    document.getElementById("checkOutTime").value;

    const advance =
    document.getElementById("advance").value || 0;

    const total =
    document.getElementById("totalAmount").value || 0;


    if(name === "" ||
       mobile === "" ||
       roomNumber === ""){

        alert(
        "Customer Name, Mobile और Room Number भरना जरूरी है"
        );

        return;
    }


    const room =
    rooms.find(r => r.number === roomNumber);
      
    if(room){

    room.status = "Booked";

    localStorage.setItem(
        "hotelRooms",
        JSON.stringify(rooms)
    );
}
bookings.push(booking);

localStorage.setItem(
    "hotelBookings",
    JSON.stringify(bookings)
);

    if(room){

        room.status = "Booked";

    }


    const booking = {

        name:name,
        mobile:mobile,
        address:address,
        roomNumber:roomNumber,
        checkInDate:checkInDate,
        checkInTime:checkInTime,
        checkOutDate:checkOutDate,
        checkOutTime:checkOutTime,
        advance:advance,
        total:total

    };


    bookings.push(booking);
    
    bookings.push(booking);

localStorage.setItem(
    "hotelBookings",
    JSON.stringify(bookings)
);


    alert("Booking Successfully Saved!");


    showBookings();

    showRooms();

    loadBookingRooms();


    document.getElementById("customerName").value = "";

    document.getElementById("customerMobile").value = "";

    document.getElementById("customerAddress").value = "";

    document.getElementById("bookingRoom").value = "";

    document.getElementById("checkInDate").value = "";

    document.getElementById("checkInTime").value = "";

    document.getElementById("checkOutDate").value = "";

    document.getElementById("checkOutTime").value = "";

    document.getElementById("advance").value = "";

    document.getElementById("totalAmount").value = "";

}


function showBookings(){

    const list =
    document.getElementById("bookingList");


    if(bookings.length === 0){

        list.innerHTML =
        "<p>No bookings yet.</p>";

        return;

    }


    list.innerHTML = "";


    bookings.forEach((booking,index) => {

        list.innerHTML += `

        <div class="room">

            <h3>
            Room ${booking.roomNumber}
            </h3>

            <p>
            <b>Customer:</b>
            ${booking.name}
            </p>

            <p>
            <b>Mobile:</b>
            ${booking.mobile}
            </p>

            <p>
            <b>Address:</b>
            ${booking.address}
            </p>

            <p>
            <b>Check-In:</b>
            ${booking.checkInDate}
            ${booking.checkInTime}
            </p>

            <p>
            <b>Check-Out:</b>
            ${booking.checkOutDate}
            ${booking.checkOutTime}
            </p>

            <p>
            <b>Advance:</b>
            ₹${booking.advance}
            </p>

            <p>
            <b>Total:</b>
            ₹${booking.total}
            </p>

            <button onclick="viewBooking(${index})">
            👁️ View
            </button>

            <button
            class="delete"
            onclick="deleteBooking(${index})">
            🗑️ Delete
            </button>

        </div>

        `;

    });

}


function viewBooking(index){

    const booking =
    bookings[index];


    alert(

        "Customer: " + booking.name +

        "\nMobile: " + booking.mobile +

        "\nRoom: " + booking.roomNumber +

        "\nAddress: " + booking.address +

        "\nCheck-In: " +
        booking.checkInDate +
        " " +
        booking.checkInTime +

        "\nCheck-Out: " +
        booking.checkOutDate +
        " " +
        booking.checkOutTime +

        "\nAdvance: ₹" +
        booking.advance +

        "\nTotal: ₹" +
        booking.total

    );

}


function deleteBooking(index){

    if(
        confirm(
        "क्या आप यह booking delete करना चाहते हैं?"
        )
    ){

        const roomNumber =
        bookings[index].roomNumber;


        const room =
        rooms.find(
        r => r.number === roomNumber
        );


        if(room){

            room.status = "Available";

        }


        bookings.splice(index,1);
        
        localStorage.setItem(
    "hotelBookings",
    JSON.stringify(bookings)
);


        showBookings();

        showRooms();

        loadBookingRooms();

    }

}


/* START APP */

showRooms();

loadBookingRooms();

showBookings();

</script>

</body>
</html>
