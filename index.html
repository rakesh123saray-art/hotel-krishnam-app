<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotel Krishnam - Hotel Management</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f6fb;
    color:#333;
}

.header{
    background:#d62828;
    color:white;
    padding:20px 10px;
    text-align:center;
}

.header h1{margin:0;font-size:28px}
.header p{margin:6px 0 0}

.container{
    width:95%;
    max-width:1100px;
    margin:20px auto;
}

.card{
    background:white;
    padding:20px;
    margin-bottom:20px;
    border-radius:12px;
    box-shadow:0 3px 12px rgba(0,0,0,.10);
}

.card h2{
    color:#c62828;
    margin-top:0;
    border-bottom:1px solid #ddd;
    padding-bottom:10px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.stat{
    padding:18px 10px;
    border-radius:10px;
    text-align:center;
    background:#eef4ff;
}

.stat h3{margin:0;font-size:26px}
.stat p{margin:5px 0 0}

.room-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:12px;
}

.room{
    padding:15px 8px;
    border-radius:10px;
    text-align:center;
    color:white;
    font-weight:bold;
}

.available{background:#2e7d32}
.booked{background:#ef6c00}
.occupied{background:#c62828}

.room small{
    display:block;
    margin-top:5px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

label{
    font-weight:bold;
    display:block;
    margin-bottom:5px;
}

input,select{
    width:100%;
    padding:11px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:15px;
}

.full{grid-column:1/-1}

button{
    border:0;
    border-radius:7px;
    padding:11px 16px;
    color:white;
    font-size:15px;
    cursor:pointer;
    margin:4px;
}

.save-btn{
    background:#2196f3;
    width:100%;
    margin:15px 0 0;
}

.view-btn{background:#2196f3}
.delete-btn{background:#e91e63}
.checkin-btn{background:#2e7d32}
.checkout-btn{background:#d32f2f}

.booking{
    border:1px solid #ddd;
    border-left:5px solid #2196f3;
    padding:15px;
    margin-bottom:15px;
    border-radius:8px;
    background:#fafafa;
}

.booking h3{
    margin-top:0;
    color:#c62828;
}

.status{
    display:inline-block;
    padding:5px 9px;
    border-radius:15px;
    color:white;
    font-size:12px;
    font-weight:bold;
}

.status-booked{background:#ef6c00}
.status-checkin{background:#2e7d32}
.status-checkout{background:#616161}

.customer{
    border:1px solid #ddd;
    border-left:5px solid #8e24aa;
    padding:15px;
    margin-bottom:12px;
    border-radius:8px;
    background:#fafafa;
}

.customer h3{
    margin-top:0;
    color:#8e24aa;
}

.search{
    margin-bottom:15px;
}

.footer{
    text-align:center;
    padding:20px;
    color:#777;
    font-size:13px;
}

@media(max-width:700px){

    .stats{grid-template-columns:1fr}

    .room-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .full{grid-column:auto}

    .header h1{font-size:23px}
}
</style>
</head>

<body>

<div class="header">
    <h1>Hotel Krishnam</h1>
    <p>Hotel Management System</p>
</div>

<div class="container">

<!-- DASHBOARD -->

<div class="card">
<h2>📊 Room Dashboard</h2>

<div class="stats">

<div class="stat">
<h3 id="totalRooms">10</h3>
<p>Total Rooms</p>
</div>

<div class="stat">
<h3 id="availableRooms">10</h3>
<p>Available</p>
</div>

<div class="stat">
<h3 id="bookedRooms">0</h3>
<p>Booked / Occupied</p>
</div>

</div>
</div>


<!-- ROOMS -->

<div class="card">
<h2>🛏️ Room Management</h2>
<div id="roomList" class="room-grid"></div>
</div>


<!-- NEW BOOKING -->

<div class="card">

<h2>📝 New Booking</h2>

<div class="form-grid">

<div>
<label>Customer Name</label>
<input type="text" id="customerName" placeholder="Customer Name">
</div>

<div>
<label>Mobile Number</label>
<input type="tel" id="mobile" placeholder="Mobile Number">
</div>

<div class="full">
<label>Customer Address</label>
<input type="text" id="address" placeholder="Customer Address">
</div>

<div>
<label>Select Room</label>
<select id="roomNumber">
<option value="">Select Room</option>
</select>
</div>

<div>
<label>Check-In Date</label>
<input type="date" id="checkInDate">
</div>

<div>
<label>Check-In Time</label>
<input type="time" id="checkInTime">
</div>

<div>
<label>Check-Out Date</label>
<input type="date" id="checkOutDate">
</div>

<div>
<label>Check-Out Time</label>
<input type="time" id="checkOutTime">
</div>

<div>
<label>Advance Amount</label>
<input type="number" id="advance" placeholder="₹0">
</div>

<div>
<label>Total Amount</label>
<input type="number" id="total" placeholder="₹0">
</div>

</div>

<button class="save-btn" onclick="saveBooking()">
💾 Save Booking
</button>

</div>


<!-- CUSTOMER MANAGEMENT -->

<div class="card">

<h2>👤 Customer Management</h2>

<input
    class="search"
    type="text"
    id="customerSearch"
    placeholder="🔍 Search customer name or mobile..."
    oninput="showCustomers()"
>

<div id="customerList"></div>

</div>


<!-- BOOKING LIST -->

<div class="card">

<h2>📋 Booking List</h2>

<div id="bookingList"></div>

</div>

</div>


<div class="footer">
Hotel Krishnam © 2026
</div>


<script>

/* ROOMS */

const defaultRooms=[

{number:"101",type:"AC",status:"Available"},
{number:"102",type:"AC",status:"Available"},
{number:"103",type:"AC",status:"Available"},
{number:"104",type:"AC",status:"Available"},
{number:"105",type:"AC",status:"Available"},

{number:"106",type:"Non-AC",status:"Available"},
{number:"107",type:"Non-AC",status:"Available"},
{number:"108",type:"Non-AC",status:"Available"},
{number:"109",type:"Non-AC",status:"Available"},
{number:"110",type:"Non-AC",status:"Available"}

];

let rooms=
JSON.parse(localStorage.getItem("hotelRooms")) ||
JSON.parse(JSON.stringify(defaultRooms));

let bookings=
JSON.parse(localStorage.getItem("hotelBookings")) || [];


/* SAVE */

function saveRooms(){
localStorage.setItem("hotelRooms",JSON.stringify(rooms));
}

function saveBookings(){
localStorage.setItem("hotelBookings",JSON.stringify(bookings));
}


/* ROOMS */

function showRooms(){

const list=document.getElementById("roomList");

list.innerHTML="";

rooms.forEach(room=>{

let cls="available";

if(room.status==="Booked")cls="booked";
if(room.status==="Occupied")cls="occupied";

list.innerHTML+=`

<div class="room ${cls}">
Room ${room.number}
<small>${room.type}</small>
<small>${room.status}</small>
</div>

`;

});

updateDashboard();

}


/* DASHBOARD */

function updateDashboard(){

let available=
rooms.filter(r=>r.status==="Available").length;

let busy=
rooms.filter(r=>
r.status==="Booked" ||
r.status==="Occupied"
).length;

document.getElementById("totalRooms").innerText=rooms.length;

document.getElementById("availableRooms").innerText=available;

document.getElementById("bookedRooms").innerText=busy;

}


/* ROOM DROPDOWN */

function loadBookingRooms(){

const select=document.getElementById("roomNumber");

select.innerHTML='<option value="">Select Room</option>';

rooms.forEach(room=>{

if(room.status==="Available"){

select.innerHTML+=`

<option value="${room.number}">
Room ${room.number} - ${room.type}
</option>

`;

}

});

}


/* SAVE BOOKING */

function saveBooking(){

const customerName=
document.getElementById("customerName").value.trim();

const mobile=
document.getElementById("mobile").value.trim();

const address=
document.getElementById("address").value.trim();

const roomNumber=
document.getElementById("roomNumber").value;

const checkInDate=
document.getElementById("checkInDate").value;

const checkInTime=
document.getElementById("checkInTime").value;

const checkOutDate=
document.getElementById("checkOutDate").value;

const checkOutTime=
document.getElementById("checkOutTime").value;

const advance=
document.getElementById("advance").value || 0;

const total=
document.getElementById("total").value || 0;


if(
!customerName ||
!mobile ||
!roomNumber ||
!checkInDate ||
!checkInTime ||
!checkOutDate ||
!checkOutTime
){

alert("Please fill all required details.");
return;

}


const room=
rooms.find(r=>r.number===roomNumber);

if(!room){

alert("Room not found.");
return;

}

if(room.status!=="Available"){

alert("This room is not available.");
return;

}


const booking={

customerName:customerName,
mobile:mobile,
address:address,
roomNumber:roomNumber,
checkInDate:checkInDate,
checkInTime:checkInTime,
checkOutDate:checkOutDate,
checkOutTime:checkOutTime,
advance:advance,
total:total,
status:"Booked"

};


bookings.push(booking);

room.status="Booked";

saveBookings();
saveRooms();

showRooms();
loadBookingRooms();
showBookings();
showCustomers();

clearForm();

alert(
"Booking saved successfully!\nRoom "+
roomNumber+" is now Booked."
);

}


/* CLEAR FORM */

function clearForm(){

document.getElementById("customerName").value="";
document.getElementById("mobile").value="";
document.getElementById("address").value="";
document.getElementById("roomNumber").value="";
document.getElementById("checkInDate").value="";
document.getElementById("checkInTime").value="";
document.getElementById("checkOutDate").value="";
document.getElementById("checkOutTime").value="";
document.getElementById("advance").value="";
document.getElementById("total").value="";

}


/* CUSTOMER MANAGEMENT */

function showCustomers(){

const list=document.getElementById("customerList");

const search=
document.getElementById("customerSearch").value
.toLowerCase()
.trim();

list.innerHTML="";


const filtered=bookings.filter(b=>

b.customerName.toLowerCase().includes(search) ||

b.mobile.toLowerCase().includes(search)

);


if(filtered.length===0){

list.innerHTML="<p>No customer found.</p>";
return;

}


filtered.forEach(customer=>{

let statusClass="status-booked";

if(customer.status==="Checked-In")
statusClass="status-checkin";

if(customer.status==="Checked-Out")
statusClass="status-checkout";


list.innerHTML+=`

<div class="customer">

<h3>👤 ${escapeHTML(customer.customerName)}</h3>

<p>
<b>📱 Mobile:</b>
${escapeHTML(customer.mobile)}
</p>

<p>
<b>🏠 Address:</b>
${escapeHTML(customer.address || "-")}
</p>

<p>
<b>🛏️ Room:</b>
${customer.roomNumber}
</p>

<p>
<b>📅 Check-In:</b>
${customer.checkInDate}
${customer.checkInTime}
</p>

<p>
<b>📅 Check-Out:</b>
${customer.checkOutDate}
${customer.checkOutTime}
</p>

<p>
<b>📌 Status:</b>
<span class="status ${statusClass}">
${customer.status}
</span>
</p>

</div>

`;

});

}


/* BOOKING LIST */

function showBookings(){

const list=document.getElementById("bookingList");

list.innerHTML="";


if(bookings.length===0){

list.innerHTML="<p>No booking found.</p>";
return;

}


bookings.forEach((booking,index)=>{

let statusClass="status-booked";

if(booking.status==="Checked-In")
statusClass="status-checkin";

if(booking.status==="Checked-Out")
statusClass="status-checkout";


let buttons=`

<button
class="view-btn"
onclick="viewBooking(${index})">
👁 View
</button>

`;


if(booking.status==="Booked"){

buttons+=`

<button
class="checkin-btn"
onclick="checkInBooking(${index})">
🟢 Check-In
</button>

`;

}


if(booking.status==="Checked-In"){

buttons+=`

<button
class="checkout-btn"
onclick="checkOutBooking(${index})">
🔴 Check-Out
</button>

`;

}


buttons+=`

<button
class="delete-btn"
onclick="deleteBooking(${index})">
🗑 Delete
</button>

`;


list.innerHTML+=`

<div class="booking">

<h3>🛏️ Room ${booking.roomNumber}</h3>

<p>
<b>Customer:</b>
${escapeHTML(booking.customerName)}
</p>

<p>
<b>Mobile:</b>
${escapeHTML(booking.mobile)}
</p>

<p>
<b>Address:</b>
${escapeHTML(booking.address || "-")}
</p>

<p>
<b>Check-In:</b>
${booking.checkInDate}
${booking.checkInTime}
</p>

<p>
<b>Check-Out:</b>
${booking.checkOutDate}
${booking.checkOutTime}
</p>

<p>
<b>Advance:</b>
₹${booking.advance}
</p>

<p>
<b>Total:</b>
₹${booking.total}
</p>

<p>
<b>Status:</b>
<span class="status ${statusClass}">
${booking.status}
</span>
</p>

${buttons}

</div>

`;

});

}


/* CHECK IN */

function checkInBooking(index){

const booking=bookings[index];

if(!booking)return;

if(booking.status!=="Booked"){

alert("This booking cannot be checked in.");
return;

}

if(!confirm(
"Room "+booking.roomNumber+
" ko Check-In karna hai?"
))return;


booking.status="Checked-In";


const room=
rooms.find(r=>r.number===booking.roomNumber);

if(room){
room.status="Occupied";
}


saveBookings();
saveRooms();

showRooms();
loadBookingRooms();
showBookings();
showCustomers();

alert(
"Check-In successful!\nRoom "+
booking.roomNumber+
" is now Occupied."
);

}


/* CHECK OUT */

function checkOutBooking(index){

const booking=bookings[index];

if(!booking)return;

if(booking.status!=="Checked-In"){

alert("Customer must be Checked-In first.");
return;

}

if(!confirm(
"Room "+booking.roomNumber+
" ka Check-Out karna hai?"
))return;


booking.status="Checked-Out";


const room=
rooms.find(r=>r.number===booking.roomNumber);

if(room){
room.status="Available";
}


saveBookings();
saveRooms();

showRooms();
loadBookingRooms();
showBookings();
showCustomers();

alert(
"Check-Out successful!\nRoom "+
booking.roomNumber+
" is now Available."
);

}


/* VIEW */

function viewBooking(index){

const b=bookings[index];

alert(

"HOTEL KRISHNAM\n\n"+

"Room: "+b.roomNumber+"\n"+

"Customer: "+b.customerName+"\n"+

"Mobile: "+b.mobile+"\n"+

"Address: "+(b.address||"-")+"\n\n"+

"Check-In: "+
b.checkInDate+" "+b.checkInTime+"\n"+

"Check-Out: "+
b.checkOutDate+" "+b.checkOutTime+"\n\n"+

"Advance: ₹"+b.advance+"\n"+

"Total: ₹"+b.total+"\n\n"+

"Status: "+b.status

);

}


/* DELETE */

function deleteBooking(index){

const booking=bookings[index];

if(!booking)return;

if(!confirm(
"Is booking ko delete karna hai?"
))return;


const room=
rooms.find(r=>r.number===booking.roomNumber);

if(room){
room.status="Available";
}


bookings.splice(index,1);

saveBookings();
saveRooms();

showRooms();
loadBookingRooms();
showBookings();
showCustomers();

alert("Booking deleted successfully.");

}


/* SECURITY */

function escapeHTML(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* START */

showRooms();
loadBookingRooms();
showBookings();
showCustomers();

</script>

</body>
</html>
